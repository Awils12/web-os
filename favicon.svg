<svg viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes pulse { 0%, 100% { r: 85; opacity: 0.9; } 50% { r: 88; opacity: 0.5; } }
      .glow-circle { animation: pulse 3s ease-in-out infinite; }
    </style>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="inner-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:0" />
    </radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Animated glow pulse -->
  <circle cx="90" cy="90" r="85" fill="none" stroke="url(#grad1)" stroke-width="3" opacity="0.3" class="glow-circle"/>
  
  <!-- Main gradient circle -->
  <circle cx="90" cy="90" r="82" fill="url(#grad1)" filter="url(#shadow)"/>
  
  <!-- Inner light reflection -->
  <circle cx="90" cy="90" r="82" fill="url(#inner-glow)"/>
  
  <!-- Main diamond shape (◈) with depth -->
  <g transform="translate(90, 90)">
    <!-- Shadow layer -->
    <path d="M 0,-38 L 27,-27 L 38,0 L 27,27 L 0,38 L -27,27 L -38,0 L -27,-27 Z" 
          fill="#000" opacity="0.15" transform="translate(1, 2)"/>
    
    <!-- Outer diamond -->
    <path d="M 0,-38 L 27,-27 L 38,0 L 27,27 L 0,38 L -27,27 L -38,0 L -27,-27 Z" 
          fill="white" opacity="1"/>
    
    <!-- Inner gradient accent -->
    <path d="M 0,-32 L 22,-22 L 32,0 L 22,22 L 0,32 L -22,22 L -32,0 L -22,-22 Z" 
          fill="url(#grad1)" opacity="0.2"/>
  </g>
  
  <!-- Corner accent dots (glowing) -->
  <circle cx="28" cy="28" r="5" fill="white" opacity="0.8" filter="url(#shadow)"/>
  <circle cx="152" cy="28" r="5" fill="white" opacity="0.8" filter="url(#shadow)"/>
  <circle cx="28" cy="152" r="5" fill="white" opacity="0.8" filter="url(#shadow)"/>
  <circle cx="152" cy="152" r="5" fill="white" opacity="0.8" filter="url(#shadow)"/>
</svg>