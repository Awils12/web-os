<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebOS Standalone</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%2360a5fa'/%3E%3Cpath d='M50 15 85 50 50 85 15 50z' fill='white'/%3E%3Cpath d='M50 27 73 50 50 73 27 50z' fill='%2360a5fa'/%3E%3C/svg%3E">
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#f8fafc;background:#080d1a;--accent:#60a5fa}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}button,input,textarea{font:inherit}button{border:0;cursor:pointer}.desktop{position:relative;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(circle at 15% 20%,#2563eb 0,transparent 30%),radial-gradient(circle at 85% 15%,#9333ea 0,transparent 32%),linear-gradient(135deg,#0891b2,#111827 70%);background-size:180% 180%;animation:drift 18s ease infinite}.desktop.sunset{background:radial-gradient(circle at 25% 30%,#f97316 0,transparent 32%),radial-gradient(circle at 82% 15%,#db2777 0,transparent 35%),linear-gradient(135deg,#312e81,#111827 70%)}.desktop.midnight{background:radial-gradient(circle at 30% 20%,#1e40af 0,transparent 30%),radial-gradient(circle at 85% 80%,#4c1d95 0,transparent 35%),#020617}.desktop.forest{background:radial-gradient(circle at 20% 20%,#15803d 0,transparent 32%),radial-gradient(circle at 85% 80%,#0f766e 0,transparent 35%),#052e16}@keyframes drift{50%{background-position:100% 50%}}.stars{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:70px 70px;opacity:.18}.brand{position:absolute;top:28px;left:34px;display:flex;gap:12px;align-items:center;z-index:2}.logo{display:grid;place-items:center;width:42px;height:42px;border:1px solid #ffffff44;border-radius:14px;background:#ffffff25;font-size:24px}.brand strong,.brand span{display:block}.brand span{color:#cbd5e1;font-size:11px;margin-top:3px}.icons{position:absolute;top:120px;left:30px;display:grid;gap:8px;z-index:2}.icon{width:90px;padding:9px 3px;border-radius:10px;background:transparent;color:white;text-shadow:0 2px 5px #000;display:grid;gap:6px;place-items:center}.icon:hover{background:#ffffff22}.icon span{font-size:32px}.icon b{font-size:11px;font-weight:500}.glass{border:1px solid #ffffff2b;background:#0f172ab8;box-shadow:0 18px 60px #0007;backdrop-filter:blur(20px)}.widget{position:absolute;top:28px;right:32px;padding:13px 15px;border-radius:13px;min-width:145px;font-size:12px}.widget small,.widget strong{display:block}.widget small{color:#cbd5e1;margin-top:4px}.window{position:absolute;min-width:330px;min-height:210px;overflow:hidden;border:1px solid #ffffff35;border-radius:14px;background:#0f172af2;box-shadow:0 25px 80px #0009;z-index:3}.window.max{inset:12px 12px 72px!important;width:auto!important;height:auto!important}.head{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;background:#ffffff10;border-bottom:1px solid #ffffff1c;cursor:grab}.title{font-size:13px;font-weight:600}.controls{display:flex;gap:5px}.controls button,.close{width:25px;height:25px;border-radius:7px;background:transparent;color:#cbd5e1}.controls button:hover{background:#ffffff1c}.controls button:last-child:hover{background:#ef4444;color:white}.body{height:calc(100% - 46px);overflow:auto}.app{height:100%;padding:18px}.notes{display:flex;flex-direction:column;height:100%;padding:0}.notes textarea{flex:1;width:100%;resize:none;background:transparent;border:0;color:white;padding:22px;line-height:1.7}.bar{display:flex;gap:8px;align-items:center;padding:12px;border-bottom:1px solid #ffffff1c}.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}.card{padding:20px 10px;text-align:center;border-radius:12px;background:#ffffff0b;border:1px solid #ffffff0d}.card .emoji{font-size:30px;display:block;margin-bottom:8px}.calc{display:grid;place-items:center;height:100%}.calcbox{width:280px;padding:14px;border-radius:18px;background:#02061788}.display{min-height:65px;display:flex;align-items:center;justify-content:flex-end;padding:10px;font-size:28px;word-break:break-all}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.keys button{height:48px;border-radius:10px;background:#ffffff12;color:white;font-size:18px}.terminal{height:100%;display:flex;flex-direction:column;background:#020617;padding:16px;color:#86efac;font:12px monospace}.output{flex:1;white-space:pre-wrap;overflow:auto}.terminal input{background:transparent;border:0;color:#bef264;flex:1;font:inherit}.termform{display:flex;gap:8px;border-top:1px solid #ffffff1c;padding-top:10px}.launcher{position:absolute;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);width:600px;max-width:calc(100vw - 30px);padding:18px;border-radius:18px}.hidden{display:none!important}.search{width:100%;padding:13px;border:1px solid #ffffff1c;border-radius:10px;background:#ffffff0b;color:white;margin:12px 0}.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}.apps button{min-height:95px;border-radius:12px;background:#ffffff0b;color:white;display:grid;place-items:center;gap:6px}.apps span{font-size:28px}.taskbar{position:absolute;z-index:8;left:14px;right:14px;bottom:12px;height:52px;border-radius:15px;display:flex;align-items:center;padding:7px}.start{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#a78bfa);color:white;font-size:20px}.tasks{display:flex;gap:5px;margin-left:8px}.tasks button{height:38px;border-radius:9px;background:#ffffff10;color:white;padding:0 10px}.tray{margin-left:auto;color:#cbd5e1;font-size:12px}.toast{position:absolute;left:50%;bottom:80px;transform:translate(-50%,10px);opacity:0;background:#0f172af2;border:1px solid #ffffff2b;padding:10px 16px;border-radius:999px;z-index:20;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.mini{padding:8px 12px;border-radius:8px;background:#ffffff12;color:white}.browser{height:100%;display:flex;flex-direction:column}.browser iframe{flex:1;width:100%;border:0;background:white}.browser input{flex:1;padding:8px;border-radius:8px;border:1px solid #ffffff22;background:#ffffff0b;color:white}.settings{display:grid;gap:14px}.settings button{padding:10px;border-radius:9px;background:#ffffff12;color:white;margin:3px}.palette{position:absolute;top:80px;right:20px;z-index:9;width:300px;padding:14px;border-radius:14px}.about{padding:25px;text-align:center}@media(max-width:700px){.window{top:12px!important;left:12px!important;width:calc(100vw - 24px)!important;height:calc(100vh - 90px)!important}.widget{right:15px}.icons{left:10px}.launcher{width:calc(100vw - 24px)}}
</style>
</head>
<body>
<main id="desktop" class="desktop"><div class="stars"></div><header class="brand"><div class="logo">◈</div><div><strong>WebOS</strong><span>Standalone workspace</span></div></header><section class="icons"><button class="icon" data-open="files"><span>📁</span><b>Files</b></button><button class="icon" data-open="notes"><span>📝</span><b>Notes</b></button><button class="icon" data-open="browser"><span>🌐</span><b>Browser</b></button><button class="icon" data-open="calculator"><span>🧮</span><b>Calculator</b></button></section><div class="widget glass"><small>TIME</small><strong id="time">--:--</strong><small id="date">Loading…</small></div><section id="layer"></section><aside id="launcher" class="launcher glass hidden"><div style="display:flex;justify-content:space-between;align-items:center"><div><small>APPLICATIONS</small><h2>Launch something</h2></div><button class="close" data-close-launcher>×</button></div><input id="search" class="search" placeholder="Search apps…"><div id="apps" class="apps"></div></aside><aside id="palette" class="palette glass hidden"><strong>COMMAND PALETTE</strong><input class="search" id="command" placeholder="Try: theme sunset"><div id="commands"></div></aside><footer class="taskbar glass"><button class="start" data-start>◈</button><div id="tasks" class="tasks"></div><div class="tray">✦ WebOS offline-ready</div></footer><div id="toast" class="toast"></div></main>
<script>
const apps={files:['📁','Files',620,410],notes:['📝','Notes',600,420],browser:['🌐','Browser',700,470],calculator:['🧮','Calculator',330,430],terminal:['⌘','Terminal',620,390],settings:['⚙️','Settings',520,390],about:['◈','About',420,300]};let windows=[],z=1,note=localStorage.webosNote||'Welcome to WebOS!\n\nThis standalone edition works by opening this file directly.';const desktop=document.querySelector('#desktop'),layer=document.querySelector('#layer'),launcher=document.querySelector('#launcher'),appsGrid=document.querySelector('#apps'),tasks=document.querySelector('#tasks'),toast=document.querySelector('#toast');const say=t=>{toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)};const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));function openApp(id){if(!apps[id])return;let w=windows.find(x=>x.id===id);if(w){w.hidden=false;w.z=++z}else{let a=apps[id];w={id,x:150+windows.length*24,y:90+windows.length*18,w:a[2],h:a[3],z:++z,hidden:false};windows.push(w)}launcher.classList.add('hidden');render();say(apps[id][1]+' opened')}function closeApp(id){windows=windows.filter(w=>w.id!==id);render()}function body(id){if(id==='notes')return `<div class="notes"><div class="bar">Quick Notes <span style="margin-left:auto;color:#4ade80">● Autosaved</span></div><textarea id="note">${esc(note)}</textarea></div>`;if(id==='files')return `<div class="app"><div class="bar">My Files <button class="mini" style="margin-left:auto" onclick="say('Files are stored in your browser')">New file</button></div><div class="cardgrid">${['📁 Documents','📁 Pictures','📁 Projects','📄 Welcome.txt','📦 Ideas.md'].map(x=>`<div class="card"><span class="emoji">${x.slice(0,2)}</span>${esc(x.slice(2))}</div>`).join('')}</div></div>`;if(id==='calculator')return `<div class="calc"><div class="calcbox"><div class="display" id="display">0</div><div class="keys">${['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','='].map(k=>`<button onclick="calc('${k}')">${k}</button>`).join('')}</div></div></div>`;if(id==='terminal')return `<div class="terminal"><div class="output" id="out">WebOS Terminal\nType help for commands.\n</div><form class="termform" onsubmit="term(event)"><span>webos:$</span><input id="cmd" autofocus></form></div>`;if(id==='browser')return `<div class="browser"><div class="bar"><input id="url" value="https://example.com"><button class="mini" onclick="go()">Go</button></div><iframe id="frame" src="https://example.com" title="Browser"></iframe></div>`;if(id==='settings')return `<div class="app settings"><h2>Personalize WebOS</h2><div>Theme</div><div><button onclick="theme('aurora')">Aurora</button><button onclick="theme('sunset')">Sunset</button><button onclick="theme('midnight')">Midnight</button><button onclick="theme('forest')">Forest</button></div><div>Shortcuts</div><div>Press <b>/</b> for launcher · <b>Ctrl/⌘ K</b> for commands · <b>Alt C</b> for cinematic mode</div></div>`;return `<div class="about"><h1>◈ WebOS</h1><p>A tiny browser desktop that runs from one file.</p><p>No server required.</p></div>`}function render(){layer.innerHTML='';windows.filter(w=>!w.hidden).sort((a,b)=>a.z-b.z).forEach(w=>{let e=document.createElement('section');e.className='window';e.style.cssText=`left:${w.x}px;top:${w.y}px;width:${w.w}px;height:${w.h}px;z-index:${w.z}`;e.innerHTML=`<header class="head"><div class="title">${apps[w.id][0]} ${apps[w.id][1]}</div><div class="controls"><button data-min>—</button><button data-max>□</button><button data-x>×</button></div></header><div class="body">${body(w.id)}</div>`;layer.appendChild(e);e.querySelector('[data-x]').onclick=()=>closeApp(w.id);e.querySelector('[data-min]').onclick=()=>{w.hidden=true;render()};e.querySelector('[data-max]').onclick=()=>{e.classList.toggle('max');w.max=!w.max};let h=e.querySelector('.head');h.onmousedown=ev=>{let sx=ev.clientX,sy=ev.clientY,ox=w.x,oy=w.y;const move=m=>{w.x=ox+m.clientX-sx;w.y=oy+m.clientY-sy;e.style.left=w.x+'px';e.style.top=w.y+'px'};const up=()=>{document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up)};document.addEventListener('mousemove',move);document.addEventListener('mouseup',up)};let n=e.querySelector('#note');if(n)n.oninput=()=>{note=n.value;localStorage.webosNote=note};});tasks.innerHTML=windows.map(w=>`<button onclick="openApp('${w.id}')">${apps[w.id][0]}</button>`).join('')}function calc(k){let d=document.querySelector('#display');if(!d)return;let v=d.textContent;if(k==='C')v='0';else if(k==='⌫')v=v.length>1?v.slice(0,-1):'0';else if(k==='='){try{v=String(Function('return '+v.replaceAll('×','*').replaceAll('÷','/').replaceAll('−','-'))())}catch{v='Error'}}else v=v==='0'&&!['.','+','−','×','÷','%'].includes(k)?k:v+k;d.textContent=v}function term(e){e.preventDefault();let i=document.querySelector('#cmd'),o=document.querySelector('#out'),c=i.value.trim().toLowerCase(),r=c==='help'?'Commands: help, clear, date, theme':c==='clear'?'':c==='date'?new Date().toString():c==='theme'?`Theme: ${desktop.className}`:`Command not found: ${c}`;if(c==='clear')o.textContent='';else o.textContent+=`webos:$ ${esc(i.value)}\n${r}\n`;i.value=''}function go(){let u=document.querySelector('#url').value.trim();if(!/^https?:\/\//i.test(u))u='https://'+u;document.querySelector('#frame').src=u}function theme(t){desktop.className='desktop '+t;say('Theme: '+t)}function showLauncher(){launcher.classList.toggle('hidden');appsGrid.innerHTML=Object.entries(apps).map(([id,a])=>`<button onclick="openApp('${id}')"><span>${a[0]}</span><b>${a[1]}</b></button>`).join('')}document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openApp(b.dataset.open));document.querySelector('[data-start]').onclick=showLauncher;document.querySelector('[data-close-launcher]').onclick=()=>launcher.classList.add('hidden');document.querySelector('#search').oninput=e=>document.querySelectorAll('#apps button').forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(e.target.value.toLowerCase()));document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();showLauncher()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.querySelector('#palette').classList.toggle('hidden')}if(e.altKey&&e.key.toLowerCase()==='c'){desktop.classList.toggle('cinematic');say('Cinematic mode toggled')}if(e.key==='Escape'){launcher.classList.add('hidden');document.querySelector('#palette').classList.add('hidden')}});setInterval(()=>{let d=new Date();document.querySelector('#time').textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});document.querySelector('#date').textContent=d.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'})},1000);render();say('WebOS ready');
</script>
</body>
</html>
